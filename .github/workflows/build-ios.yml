name: Build iOS IPA

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ldid for fakesigning
        run: brew install ldid

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Find workspace and scheme
        id: find
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 1 | head -1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list 2>/dev/null | grep -A100 "Schemes:" | tail -n +2 | head -1 | xargs)
          echo "workspace=$WORKSPACE" >> $GITHUB_OUTPUT
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT
          echo "Found: workspace=$WORKSPACE scheme=$SCHEME"

      - name: Archive app
        run: |
          xcodebuild archive \
            -workspace "${{ steps.find.outputs.workspace }}" \
            -scheme "${{ steps.find.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=FAKETEAM123 \
            SKIP_INSTALL=NO

      - name: Create IPA
        run: |
          # Debug: show full archive structure
          echo "=== Archive Products ==="
          find "$PWD/build/App.xcarchive/Products" -type d 2>/dev/null || echo "No Products dir"
          echo "=== All .app dirs ==="
          find "$PWD/build/App.xcarchive" -name "*.app" -type d 2>/dev/null || echo "No .app found"
          echo "======================"

          APP_PATH=$(find "$PWD/build/App.xcarchive/Products" -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app in archive. Full archive contents:"
            find "$PWD/build/App.xcarchive" -maxdepth 4 -type d
            exit 1
          fi
          echo "Found app: $APP_PATH"

          # Fakesign binary with ldid for LiveContainer
          BINARY="$APP_PATH/${{ steps.find.outputs.scheme }}"
          [ -f "$BINARY" ] && ldid -S "$BINARY" && echo "Fakesigned binary"

          # Fakesign any frameworks
          find "$APP_PATH/Frameworks" -name "*.dylib" -exec ldid -S {} \; 2>/dev/null || true

          # Package as IPA
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r WiiHomebrewSender.ipa Payload
          echo "IPA created: $(du -h WiiHomebrewSender.ipa | cut -f1)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WiiHomebrewSender-iOS
          path: WiiHomebrewSender.ipa
