name: Build iOS IPA

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ldid for fakesigning
        run: brew install ldid

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Find workspace and scheme
        id: find
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 1 | head -1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list 2>/dev/null | grep -A100 "Schemes:" | tail -n +2 | head -1 | xargs)
          echo "workspace=$WORKSPACE" >> $GITHUB_OUTPUT
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT
          echo "Found: workspace=$WORKSPACE scheme=$SCHEME"

      - name: Archive unsigned app
        run: |
          xcodebuild archive \
            -workspace "${{ steps.find.outputs.workspace }}" \
            -scheme "${{ steps.find.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Create IPA
        run: |
          # Show what's in the archive
          ls -la "$PWD/build/App.xcarchive/Products/Applications/" || echo "Applications dir not found"
          find "$PWD/build/App.xcarchive/Products" -type d -name "*.app" || echo "No .app found in Products"
          find "$PWD/build/App.xcarchive" -type d -name "*.app" | head -5

          # Find the .app bundle
          APP_PATH=$(find "$PWD/build/App.xcarchive" -type d -name "*.app" | head -1)
          echo "Using app: $APP_PATH"

          # Create Payload and copy .app
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # Fakesign with ldid for LiveContainer compatibility
          APP_NAME=$(basename "$APP_PATH" .app)
          ldid -S "Payload/$(basename $APP_PATH)/$APP_NAME" || echo "ldid fakesign skipped"

          # Package as IPA
          zip -r WiiHomebrewSender.ipa Payload
          echo "IPA created: $(ls -lh WiiHomebrewSender.ipa)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WiiHomebrewSender-iOS
          path: WiiHomebrewSender.ipa
