name: Build iOS IPA

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ldid for fakesigning
        run: brew install ldid

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Find workspace and scheme
        id: find
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 1 | head -1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list 2>/dev/null | grep -A100 "Schemes:" | tail -n +2 | head -1 | xargs)
          echo "workspace=$WORKSPACE" >> $GITHUB_OUTPUT
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT
          echo "Found: workspace=$WORKSPACE scheme=$SCHEME"

      - name: Build unsigned app
        run: |
          xcodebuild build \
            -workspace "${{ steps.find.outputs.workspace }}" \
            -scheme "${{ steps.find.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            SYMROOT="$PWD/build" \
            OBJROOT="$PWD/build/obj" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SKIP_INSTALL=NO

      - name: Create IPA
        run: |
          echo "=== Build output ==="
          ls -la "$PWD/build/Release-iphoneos/" || true
          find "$PWD/build" -name "*.app" -type d
          echo "===================="

          APP_PATH="$PWD/build/Release-iphoneos/${{ steps.find.outputs.scheme }}.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find "$PWD/build" -name "*.app" -type d | head -1)
          fi

          echo "Using app: $APP_PATH"
          ls -la "$APP_PATH"

          # Fakesign with ldid for LiveContainer
          BINARY="$APP_PATH/${{ steps.find.outputs.scheme }}"
          if [ -f "$BINARY" ]; then
            ldid -S "$BINARY" || echo "ldid warning (non-fatal)"
          fi

          # Package as IPA
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r WiiHomebrewSender.ipa Payload
          echo "IPA size: $(du -h WiiHomebrewSender.ipa | cut -f1)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WiiHomebrewSender-iOS
          path: WiiHomebrewSender.ipa
