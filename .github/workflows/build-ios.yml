name: Build iOS IPA

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ldid for fakesigning
        run: brew install ldid

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Get app name
        id: find
        run: |
          # Get the actual app name from app.json
          APP_NAME=$(node -e "console.log(require('./app.json').expo.name.replace(/\s+/g, ''))")
          echo "name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "App name: $APP_NAME"
          echo "Workspace: ios/$APP_NAME.xcworkspace"
          # Verify it exists
          ls -la "ios/$APP_NAME.xcworkspace"

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Archive app
        run: |
          xcodebuild archive \
            -workspace "ios/${{ steps.find.outputs.name }}.xcworkspace" \
            -scheme "${{ steps.find.outputs.name }}" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=FAKETEAM123

      - name: Create IPA
        run: |
          echo "=== Archive Products ==="
          find "$PWD/build/App.xcarchive/Products" -type d 2>/dev/null
          echo "=== .app bundles ==="
          find "$PWD/build/App.xcarchive" -name "*.app" -type d 2>/dev/null

          APP_PATH="$PWD/build/App.xcarchive/Products/Applications/${{ steps.find.outputs.name }}.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find "$PWD/build/App.xcarchive" -name "*.app" -type d | head -1)
          fi
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: No .app found. Full archive:"
            find "$PWD/build/App.xcarchive" -maxdepth 5
            exit 1
          fi
          echo "Found app: $APP_PATH"

          # Fakesign for LiveContainer
          BINARY="$APP_PATH/${{ steps.find.outputs.name }}"
          [ -f "$BINARY" ] && ldid -S "$BINARY" && echo "Fakesigned main binary"
          find "$APP_PATH/Frameworks" -name "*.dylib" -exec ldid -S {} \; 2>/dev/null || true

          # Package as IPA
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r WiiHomebrewSender.ipa Payload
          echo "Done: $(du -h WiiHomebrewSender.ipa | cut -f1)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WiiHomebrewSender-iOS
          path: WiiHomebrewSender.ipa
