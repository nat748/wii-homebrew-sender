name: Build iOS IPA

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ldid for fakesigning
        run: brew install ldid

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Discover project
        id: find
        run: |
          ls -la ios/*.xcworkspace
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 1 | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "workspace=$WORKSPACE" >> $GITHUB_OUTPUT
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT
          echo "Using workspace=$WORKSPACE scheme=$SCHEME"

      - name: Archive app
        run: |
          xcodebuild archive \
            -workspace "${{ steps.find.outputs.workspace }}" \
            -scheme "${{ steps.find.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=FAKETEAM123

      - name: Create IPA
        run: |
          find "$PWD/build/App.xcarchive/Products" -type d 2>/dev/null
          find "$PWD/build/App.xcarchive" -name "*.app" -type d 2>/dev/null

          APP_PATH=$(find "$PWD/build/App.xcarchive" -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app in archive. Full contents:"
            find "$PWD/build/App.xcarchive" -maxdepth 5
            exit 1
          fi
          echo "Found: $APP_PATH"

          SCHEME="${{ steps.find.outputs.scheme }}"
          [ -f "$APP_PATH/$SCHEME" ] && ldid -S "$APP_PATH/$SCHEME" && echo "Fakesigned"
          find "$APP_PATH/Frameworks" -name "*.dylib" -exec ldid -S {} \; 2>/dev/null || true

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r WiiHomebrewSender.ipa Payload
          echo "Done: $(du -h WiiHomebrewSender.ipa | cut -f1)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WiiHomebrewSender-iOS
          path: WiiHomebrewSender.ipa
