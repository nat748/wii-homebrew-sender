name: Build iOS IPA

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.1
        run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ldid for fakesigning
        run: brew install ldid

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Patch Podfile for Xcode 16 compatibility
        run: |
          # Inject into existing post_install block
          sed -i '' 's/post_install do |installer|/post_install do |installer|\
            installer.pods_project.targets.each do |target|\
              target.build_configurations.each do |config|\
                config.build_settings["SWIFT_STRICT_CONCURRENCY"] = "minimal"\
                config.build_settings["SWIFT_TREAT_WARNINGS_AS_ERRORS"] = "NO"\
                config.build_settings["GCC_TREAT_WARNINGS_AS_ERRORS"] = "NO"\
              end\
            end/' ios/Podfile

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Discover project
        id: find
        run: |
          ls -la ios/*.xcworkspace
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 1 | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "workspace=$WORKSPACE" >> $GITHUB_OUTPUT
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT
          echo "Using workspace=$WORKSPACE scheme=$SCHEME"

      - name: Force Swift 5 language mode on all pods
        run: |
          # Directly modify every pbxproj in Pods to use Swift 5 mode
          find ios/Pods -name "*.pbxproj" -exec sed -i '' \
            -e 's/SWIFT_STRICT_CONCURRENCY = complete/SWIFT_STRICT_CONCURRENCY = minimal/g' \
            -e 's/SWIFT_STRICT_CONCURRENCY = targeted/SWIFT_STRICT_CONCURRENCY = minimal/g' \
            {} +
          # Also patch via xcconfig
          cat > /tmp/fix.xcconfig << 'EOF'
          SWIFT_STRICT_CONCURRENCY = minimal
          SWIFT_TREAT_WARNINGS_AS_ERRORS = NO
          GCC_TREAT_WARNINGS_AS_ERRORS = NO
          OTHER_SWIFT_FLAGS = $(inherited) -strict-concurrency=minimal
          OTHER_CFLAGS = $(inherited) -Wno-error -Wno-deprecated-declarations
          EOF

      - name: Archive app
        run: |
          xcodebuild archive \
            -workspace "${{ steps.find.outputs.workspace }}" \
            -scheme "${{ steps.find.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/App.xcarchive" \
            -xcconfig /tmp/fix.xcconfig \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=FAKETEAM123

      - name: Create IPA
        run: |
          find "$PWD/build/App.xcarchive/Products" -type d 2>/dev/null
          find "$PWD/build/App.xcarchive" -name "*.app" -type d 2>/dev/null

          APP_PATH=$(find "$PWD/build/App.xcarchive" -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app in archive. Full contents:"
            find "$PWD/build/App.xcarchive" -maxdepth 5
            exit 1
          fi
          echo "Found: $APP_PATH"

          SCHEME="${{ steps.find.outputs.scheme }}"
          [ -f "$APP_PATH/$SCHEME" ] && ldid -S "$APP_PATH/$SCHEME" && echo "Fakesigned"
          find "$APP_PATH/Frameworks" -name "*.dylib" -exec ldid -S {} \; 2>/dev/null || true

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r WiiHomebrewSender.ipa Payload
          echo "Done: $(du -h WiiHomebrewSender.ipa | cut -f1)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WiiHomebrewSender-iOS
          path: WiiHomebrewSender.ipa
