name: Build iOS IPA

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.1
        run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ldid for fakesigning
        run: brew install ldid

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Patch Podfile for Swift concurrency fix
        run: |
          # Use OTHER_SWIFT_FLAGS to directly pass compiler flag that disables strict concurrency
          # This is more reliable than SWIFT_STRICT_CONCURRENCY build setting
          sed -i '' 's/post_install do |installer|/post_install do |installer|\
            installer.pods_project.targets.each do |target|\
              target.build_configurations.each do |config|\
                config.build_settings["OTHER_SWIFT_FLAGS"] = "$(inherited) -Xfrontend -strict-concurrency=minimal"\
                config.build_settings["SWIFT_STRICT_CONCURRENCY"] = "minimal"\
                config.build_settings["SWIFT_TREAT_WARNINGS_AS_ERRORS"] = "NO"\
                config.build_settings["GCC_TREAT_WARNINGS_AS_ERRORS"] = "NO"\
              end\
            end/' ios/Podfile

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Discover project
        id: find
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 1 | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "workspace=$WORKSPACE" >> $GITHUB_OUTPUT
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT
          echo "Using workspace=$WORKSPACE scheme=$SCHEME"

      - name: Archive app
        run: |
          xcodebuild archive \
            -workspace "${{ steps.find.outputs.workspace }}" \
            -scheme "${{ steps.find.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=FAKETEAM123 \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            OTHER_SWIFT_FLAGS='$(inherited) -Xfrontend -strict-concurrency=minimal' \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Create IPA
        run: |
          APP_PATH=$(find "$PWD/build/App.xcarchive" -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app in archive. Contents:"
            find "$PWD/build/App.xcarchive" -maxdepth 5
            exit 1
          fi
          echo "Found: $APP_PATH"

          SCHEME="${{ steps.find.outputs.scheme }}"
          [ -f "$APP_PATH/$SCHEME" ] && ldid -S "$APP_PATH/$SCHEME" && echo "Fakesigned"
          find "$APP_PATH/Frameworks" -name "*.dylib" -exec ldid -S {} \; 2>/dev/null || true

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r WiiHomebrewSender.ipa Payload
          echo "Done: $(du -h WiiHomebrewSender.ipa | cut -f1)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WiiHomebrewSender-iOS
          path: WiiHomebrewSender.ipa
