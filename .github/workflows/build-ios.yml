name: Build iOS IPA

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build unsigned IPA
        run: |
          cd ios
          xcodebuild \
            -workspace wiihomebrewsender.xcworkspace \
            -scheme wiihomebrewsender \
            -configuration Release \
            -sdk iphoneos \
            -archivePath ${{ runner.temp }}/app.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Create IPA
        run: |
          mkdir -p ${{ runner.temp }}/Payload
          cp -r "${{ runner.temp }}/app.xcarchive/Products/Applications/"*.app "${{ runner.temp }}/Payload/"
          cd ${{ runner.temp }}
          zip -r WiiHomebrewSender.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WiiHomebrewSender-iOS
          path: ${{ runner.temp }}/WiiHomebrewSender.ipa
