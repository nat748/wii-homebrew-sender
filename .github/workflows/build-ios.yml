name: Build iOS IPA

on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  DERIVED_DATA: /tmp/WiiDerivedData

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Find workspace and scheme
        id: find
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 1 | head -1)
          echo "Found workspace: $WORKSPACE"
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list 2>/dev/null | grep -A100 "Schemes:" | tail -n +2 | head -1 | xargs)
          echo "Found scheme: $SCHEME"
          echo "workspace=$WORKSPACE" >> $GITHUB_OUTPUT
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT

      - name: Build unsigned app
        run: |
          xcodebuild \
            -workspace "${{ steps.find.outputs.workspace }}" \
            -scheme "${{ steps.find.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED_DATA" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CONFIGURATION_BUILD_DIR="$DERIVED_DATA/Build"

      - name: Create IPA
        run: |
          echo "=== Listing all .app bundles ==="
          find "$DERIVED_DATA" -name "*.app" -type d
          echo "=== Listing Build dir ==="
          ls -la "$DERIVED_DATA/Build/" || true
          echo "========================"
          APP_PATH=$(find "$DERIVED_DATA" -name "*.app" -type d -not -path "*/Intermediates.noindex/*" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Falling back to any .app"
            APP_PATH=$(find "$DERIVED_DATA" -name "*.app" -type d | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found anywhere in DerivedData"
            find "$DERIVED_DATA" -type d -maxdepth 5
            exit 1
          fi
          echo "Using app at: $APP_PATH"
          mkdir -p /tmp/Payload
          cp -r "$APP_PATH" /tmp/Payload/
          cd /tmp
          zip -r WiiHomebrewSender.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WiiHomebrewSender-iOS
          path: /tmp/WiiHomebrewSender.ipa
